[project]
name = "ecozone-contract"
version = "0.1.0"
description = "Pydantic API models and the openapi.json export"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[project.scripts]
ecozone-contract = "ecozone_contract.export:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_contract"]
