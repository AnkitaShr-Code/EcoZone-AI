[project]
name = "ecozone-api"
version = "0.1.0"
description = "FastAPI service: engine routes, agent runs, static app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecozone-engine",
  "ecozone-contract",
  "ecozone-agents",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "google-cloud-storage>=3.17.1",
]

[project.scripts]
ecozone = "ecozone_api.snapshot:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_api"]

[tool.uv.sources]
ecozone-engine = { workspace = true }
ecozone-contract = { workspace = true }
ecozone-agents = { workspace = true }
