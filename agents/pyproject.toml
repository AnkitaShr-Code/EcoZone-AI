[project]
name = "ecozone-agents"
version = "0.1.0"
description = "ADK agents, the shared search loop and the output guard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecozone-engine",
  "ecozone-contract",
  "google-genai>=2.31.0",
  "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_agents"]

[tool.uv.sources]
ecozone-engine = { workspace = true }
ecozone-contract = { workspace = true }
