<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="_boot.js"></script>
<style>#lt{position:absolute;top:78px;left:calc(456px + (1920px - 456px)/2);transform:translateX(-50%)}
#lt .life{display:block}#lt .pill{white-space:nowrap}#lt.bottom{top:auto;bottom:70px}</style></head><body><div id="lt"><div class="life"><span class="pill" id="p"></span></div></div>
<script>function build(P){if(P.position==='bottom')document.getElementById('lt').classList.add('bottom');document.getElementById('p').innerHTML=(P.kicker?`<span class="kicker">${esc(P.kicker)}</span>`:'')+`<span>${esc(P.text)}</span>`}</script></body></html>
