<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="_boot.js"></script>
<style>#t{position:absolute;left:560px;top:150px;padding:34px 44px 30px;border-radius:28px;background:rgba(15,30,58,.95);box-shadow:0 24px 60px rgba(8,16,34,.35);max-width:1000px}
.brand{display:flex;align-items:center;gap:18px;font-size:76px;font-weight:800;letter-spacing:-1.5px}
.leaf{width:58px;height:58px;border-radius:0 50% 0 50%;background:var(--amber);transform:rotate(0deg)}
.tag{margin-top:10px;font-size:38px;font-weight:600;color:#e8eefa;animation:fadeIn .7s ease .5s both}
.meta{margin-top:16px;font-size:24px;color:var(--mute);animation:fadeIn .7s ease .9s both}
.bar{height:5px;width:0;background:var(--amber);border-radius:3px;margin-top:20px;animation:grow 1.1s var(--ease) .4s forwards}
@keyframes grow{to{width:260px}}</style></head><body>
<div id="t" class="life"><div class="brand"><span class="leaf"></span>EcoZone AI</div>
<div class="tag">Repair and protect a city's cooling network</div><div class="bar"></div>
<div class="meta" id="m"></div></div>
<script>function build(P){document.getElementById('m').textContent=P.meta||'Live app · Deccan Gymkhana, Pune · built from OpenStreetMap'}</script></body></html>
