[project]
name = "ecozone-pipeline"
version = "0.1.0"
description = "Offline job that turns public data into an area bundle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecozone-engine",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_pipeline"]

[tool.uv.sources]
ecozone-engine = { workspace = true }
