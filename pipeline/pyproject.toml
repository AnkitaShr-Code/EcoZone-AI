[project]
name = "ecozone-pipeline"
version = "0.1.0"
description = "Offline job that turns public data into an area bundle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecozone-engine",
  "typer>=0.12",
  "numpy>=2.0",
  "pandas>=2.2",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyarrow>=17",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pvlib>=0.11",
]

[project.scripts]
pipeline = "ecozone_pipeline.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_pipeline"]

[tool.uv.sources]
ecozone-engine = { workspace = true }
