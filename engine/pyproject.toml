[project]
name = "ecozone-engine"
version = "0.1.0"
description = "Deterministic scoring engine: the only place a number is made"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecozone_engine"]
